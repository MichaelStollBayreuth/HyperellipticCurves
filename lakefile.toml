name = "HyperellipticCurves"
defaultTargets = ["HyperellipticCurves"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false # no "assume a typo is a new variable"
relaxedAutoImplicit = false # no "assume a typo is a new variable"
maxSynthPendingDepth = 3 # same as mathlib, changes behaviour of typeclass inference
weak.linter.flexible = true # no rigid tactic (e.g. `exact`) after a flexible tactic (e.g. `simp`)
# Enable all mathlib linters: automatically matches what mathlib uses.
weak.linter.mathlibStandardSet = true
# Switch off warnings generated by `sorry`
warn.sorry = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

# Only used by `lake build HyperellipticCurves:docs`, which generates the API documentation deployed
# alongside the blueprint (see .github/workflows/deploy-pages.yml). A plain `lake build` does not
# build it. Keep `rev` in sync with `lean-toolchain`.
[[require]]
name = "doc-gen4"
git = "https://github.com/leanprover/doc-gen4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "HyperellipticCurves"

# Comparator (https://github.com/leanprover/comparator) verification harness. Not part of
# `defaultTargets`, so a plain `lake build` ignores it (and never builds the deliberate `sorry`
# in `comparator/Challenge.lean`). See comparator/README.md.
[[lean_lib]]
name = "Challenge"
srcDir = "comparator"
allowNonModules = true

[[lean_lib]]
name = "Solution"
srcDir = "comparator"
allowNonModules = true
