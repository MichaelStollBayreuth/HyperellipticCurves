# formalization.yaml (v0.3): repo-root metadata for formalization projects.
# See https://github.com/mathlib-initiative/formalization.yaml

version: "v0.3"

# project - the formalization itself (not the source).
project:
  name: "HyperellipticCurves: the Chabauty–Coleman bound for odd-degree hyperelliptic curves"
  authors: ["Michael Stoll"]
  license: "Apache-2.0"

# sources - what was formalized.
sources:
  - title: "Independence of rational points on twists of a given curve"
    authors: ["Michael Stoll"]
    id: "10.1112/S0010437X06002168"   # Compositio Math. 142 (2006), 1201-1214
    type: "journal article"
    license: "© Foundation Compositio Mathematica 2006"
    author_contacted: "yes"    # the source author is the formalization author
    prior_work: ""
  - title: "Effective Chabauty"
    authors: ["Robert F. Coleman"]
    id: "10.1215/S0012-7094-85-05240-8"   # Duke Math. J. 52 (1985), 765-770
    type: "journal article"
    license: "© Duke University Press"
    author_contacted: "no"
    prior_work: ""

# project status
status:
  scope: >
    Formalization of the method of Chabauty and Coleman for hyperelliptic curves
    C : y² = f(x) with f monic of odd degree 2g + 1, in the refined form of Stoll's Theorem 6.4
    and Corollary 6.7 (Compositio Math. 142 (2006)): if the rank dim_ℚ (J(K) ⊗ ℚ) of the
    Jacobian is at most r < g, then #C(K) ≤ #C̄(k) + 2r for every prime of good reduction whose
    residue characteristic p satisfies p > 2r + e + 1, e being the ramification index. Over ℚ
    this reads #C(ℚ) ≤ #C̄(𝔽_p) + 2r for p > 2r + 2, and the case r = g - 1 is Coleman's bound
    #C(ℚ) ≤ #C̄(𝔽_p) + 2g - 2 for p > 2g. The main theorems are proved over an abstract complete
    discrete valuation ring of characteristic 0 with algebraically closed residue field of
    characteristic ≠ 2, a uniformizer π and a bound e on the absolute ramification index
    (HyperellipticCurves/Count/Main.lean), and instantiated over every number field, more
    generally over the fraction field K of a Dedekind domain A that is finite free over ℤ, at a
    prime of A at which f is integral with squarefree reduction
    (HyperellipticCurves/Count/NumberField.lean; the local ring is constructed as a direct
    factor of W(𝔽̄_p) ⊗ A), and over ℚ (HyperellipticCurves/Count/Arithmetic.lean). Finiteness
    of C(K) when the rank is smaller than the genus (Chabauty's theorem for these curves)
    follows. Since Mathlib has no Jacobian varieties, the Jacobian is modelled as the ideal
    class group of the affine coordinate ring K[x, y]/(y² - f), with reduced Mumford
    representatives and Cantor's algorithm (HyperellipticCurves/Curve/); the reduction of
    classes is constructed by reducing points, with a specialization theorem for principal
    divisors (HyperellipticCurves/RedJ/, HyperellipticCurves/Specialization/); the logarithm on
    the kernel of reduction comes from a translated formal group law built from Cantor's
    algorithm, and its differentials are identified with the regular differentials by a
    trace-form computation (HyperellipticCurves/Log/). The p-adic analysis (Weierstrass
    preparation, Strassmann's theorem, formal group laws and their logarithms) is in
    HyperellipticCurves/Series/, residue disks and the vanishing budget of a space of
    differentials (Stoll's Theorem 6.4) in HyperellipticCurves/Disks/. Supporting material in
    Mathlib generality is in HyperellipticCurves/Mathlib/, a tree mirroring Mathlib's file
    structure, as upstreaming candidates.
    Statements that are formalized but not needed for the main theorems are kept in
    HyperellipticCurves/Archive/. A LaTeX blueprint with a dependency graph and the generated
    API documentation are published at
    https://michaelstollbayreuth.github.io/HyperellipticCurves/ .
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
